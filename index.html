<script>
    async function createVideo() {
        const prompt = document.getElementById("prompt").value;
        const resultElement = document.getElementById("result");
        resultElement.innerText = "Video tayyorlanmoqda...";
        
        try {
            const response = await fetch("/create-video/", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({prompt: prompt})
            });
            
            const result = await response.json();
            
            if (response.ok) {
                resultElement.innerText = "Natija: " + result.data;
            } else {
                resultElement.innerText = "Xatolik: " + result.message;
            }
        } catch (err) {
            resultElement.innerText = "Ulanish xatosi: " + err.message;
        }
    }
</script>
