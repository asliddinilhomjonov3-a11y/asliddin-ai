<script>
    async function createVideo() {
        const promptText = document.getElementById("prompt").value;
        const resultElement = document.getElementById("result");
        resultElement.innerText = "Video tayyorlanmoqda, kuting...";
        
        const response = await fetch("/create-video/", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({prompt: promptText})
        });
        
        const data = await response.json();
        
        // Backenddan kelgan 'result' ni ekranga chiqaramiz
        if (data.result) {
            resultElement.innerText = "Natija: " + data.result;
        } else {
            resultElement.innerText = "Kutilmagan xato yuz berdi.";
        }
    }
</script>
