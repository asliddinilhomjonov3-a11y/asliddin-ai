<body>
    <h1>AI Video Fabrika</h1>
    <input type="text" id="prompt" placeholder="Video uchun mavzu yozing...">
    <button onclick="createVideo()">Video yasash</button>
    <div id="result" style="margin-top: 20px; font-weight: bold;"></div>

    <script>
        async function createVideo() {
            const promptText = document.getElementById("prompt").value;
            const resultElement = document.getElementById("result");
            
            resultElement.innerText = "Video tayyorlanmoqda...";
            
            try {
                const response = await fetch("/create-video/", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({prompt: promptText})
                });
                
                const data = await response.json();
                console.log("Serverdan kelgan javob:", data); // F12 -> Console'da ko'rasiz
                
                if (data.video_url) {
                    resultElement.innerText = "Natija: " + data.video_url;
                } else if (data.error) {
                    resultElement.innerText = "Xatolik: " + data.error;
                } else {
                    resultElement.innerText = "Noma'lum javob: " + JSON.stringify(data);
                }
            } catch (err) {
                resultElement.innerText = "Ulanish xatosi: " + err.message;
            }
        }
    </script>
</body>
