<script>
    async function createVideo() {
        const promptText = document.getElementById("prompt").value;
        const resultElement = document.getElementById("result");
        resultElement.innerText = "Video tayyorlanmoqda, kuting...";
        
        try {
            const response = await fetch("/create-video/", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({prompt: promptText})
            });
            
            const json = await response.json();
            
            if (json.status === "success") {
                resultElement.innerText = "Natija: " + json.data;
            } else {
                resultElement.innerText = "Xatolik: " + json.message;
            }
        } catch (err) {
            resultElement.innerText = "Serverga ulanishda xatolik yuz berdi.";
        }
    }
</script>
