<script>
    async function createVideo() {
        const promptText = document.getElementById("prompt").value;
        const resultElement = document.getElementById("result");
        resultElement.innerText = "Video tayyorlanmoqda, kuting...";
        
        try {
            const response = await fetch("/create-video/", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({prompt: promptText})
            });
            
            // Javobni matn sifatida olamiz, keyin JSON ga o'giramiz
            const text = await response.text();
            console.log("Serverdan kelgan xom matn:", text);
            
            const json = JSON.parse(text);
            
            if (json.status === "success") {
                resultElement.innerText = "Natija: " + json.data;
            } else {
                resultElement.innerText = "Xatolik: " + json.message;
            }
        } catch (err) {
            resultElement.innerText = "Server javobida xatolik: " + err.message;
        }
    }
</script>
