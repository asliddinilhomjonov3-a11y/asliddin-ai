<script>
    async function createVideo() {
        const promptText = document.getElementById("prompt").value;
        const resultElement = document.getElementById("result");
        resultElement.innerText = "Video tayyorlanmoqda...";
        
        try {
            const response = await fetch("/create-video/", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({prompt: promptText})
            });
            
            const data = await response.json();
            
            // Log yordamida brauzer konsolida nima kelayotganini ko'ramiz
            console.log("Serverdan kelgan javob:", data);
            
            // Agar serverdan natija kelsa, uni ko'rsatish
            if (data.video_url) {
                resultElement.innerText = "Natija: " + data.video_url;
            } else {
                // Agar video_url bo'lmasa, serverdan kelgan butun ma'lumotni chiqarish
                resultElement.innerText = "Server javobi: " + JSON.stringify(data);
            }
        } catch (err) {
            resultElement.innerText = "Xatolik: " + err.message;
        }
    }
</script>
